services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: carepaddy
      POSTGRES_PASSWORD: carepaddy_local_dev
      POSTGRES_DB: carepaddy
    ports:
      - "5432:5432"
    volumes:
      - carepaddy_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - carepaddy_redis_data:/data

volumes:
  carepaddy_pg_data:
  carepaddy_redis_data:
